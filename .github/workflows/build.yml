name: prod

on:
  workflow_dispatch:
      - release
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/dinglan-backend/${{ github.event.repository.name }}
          tags: |
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          # 阿里云镜像仓库不接受 BuildKit provenance 使用的 OCI empty manifest
          provenance: false
          build-args: MODE=production
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            github_packages_token=${{ secrets.PACKAGES_TOKEN }}

      - name: Get Jenkins CRUMB
        id: get-crumb
        if: github.ref_name == 'dev' || github.ref_name == 'release'
        run: |
          CRUMB=$(curl -s -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" | jq -r .crumb)
          echo "crumb=$CRUMB" >> $GITHUB_OUTPUT

      - name: Notify Jenkins
        if: github.ref_name == 'dev' || github.ref_name == 'release'
        env:
          CRUMB: ${{ steps.get-crumb.outputs.crumb }}
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.tags }}
          BRANCH_NAME=${{ github.ref_name }}

          if [ "$BRANCH_NAME" = "release" ]; then
            JOB_NAME="selleros-api-prod"
          else
            JOB_NAME="selleros-api-dev"
          fi

          echo "Triggering Jenkins job: $JOB_NAME (branch: $BRANCH_NAME)"

          curl -X POST \
            -H "Jenkins-Crumb: $CRUMB" \
            -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/job/${JOB_NAME}/buildWithParameters" \
            --data token=${{ secrets.JENKINS_BUILD_TOKEN }} \
            --data IMAGE_TAG=${IMAGE_TAG} \
            --data DOCKER_REGISTRY=${{ secrets.ALIYUN_REGISTRY }}
