name: prod

on:
  push:
    branches:
      - 'release'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/dinglan-backend/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch  # 基于分支名称生成标签

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          # 阿里云镜像仓库不接受 BuildKit provenance 使用的 OCI empty manifest
          provenance: false
          build-args: MODE=production
          tags: ${{ steps.meta.outputs.tags }} # 确保 tags 被正确设置

      - name: Get Jenkins CRUMB
        id: get-crumb
        run: |
          CRUMB=$(curl -s -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" | jq -r .crumb)
          echo "crumb=$CRUMB" >> $GITHUB_OUTPUT

      - name: Notify Jenkins for Production
        if: startsWith(github.ref, 'refs/heads/release-')
        env:
          CRUMB: ${{ steps.get-crumb.outputs.crumb }}
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.tags }}
          BRANCH_NAME=${{ github.ref_name }}  # 动态获取分支名称
          curl -X POST \
            -H "Jenkins-Crumb: $CRUMB" \
            -u ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }} \
            "${{ secrets.JENKINS_URL }}/job/sourcing-api-dev/buildWithParameters" \
            --data token=${{ secrets.JENKINS_BUILD_TOKEN }} \
            --data IMAGE_TAG=${IMAGE_TAG} \
            --data DOCKER_REGISTRY=${{ secrets.ALIYUN_REGISTRY }}
